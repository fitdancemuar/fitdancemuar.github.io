<style>
:root{
  --bg:#0b0a0f; --surface:#17151d; --surface-2:#221f2b; --line:#2e2a38;
  --ink:#f6f6f6; --muted:#a8a3b5;
  --pink:#f8177f; --purple:#895cff; --cyan:#39cbf0; --yellow:#ffe047; --green:#2ee59d; --grey:#6e6880;
  --dark:#0b0a0f;
  --display:"Bebas Neue","Oswald",Impact,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
.wrap.wide{max-width:1100px}
/* signature top bar: four diagonal segments pink > purple > cyan > yellow */
.topbar{height:6px;margin:0 -16px 16px;background:linear-gradient(105deg,var(--pink) 0 25%,var(--purple) 25% 50%,var(--cyan) 50% 75%,var(--yellow) 75%)}
.logo{display:block;width:120px;height:120px;margin:8px auto 12px;border-radius:14px}
h1,h2,h3,.display{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;line-height:1.05}
h1{font-size:40px} h2{font-size:30px} h3{font-size:22px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.25em;color:var(--muted)}
.muted{color:var(--muted)} .center{text-align:center} .hidden{display:none!important}
a{color:var(--pink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-3{grid-template-columns:repeat(3,1fr)}}
/* big status block */
.status{border-radius:14px;padding:28px 16px;text-align:center;color:var(--dark);margin:12px 0}
.status .word{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:.03em}
.status .sub{font-size:17px;font-weight:600;margin-top:8px}
.status.paid{background:var(--green)} .status.unpaid{background:var(--yellow)}
.status.trial{background:var(--purple)} .status.already{background:var(--cyan)}
.status.noclass{background:var(--surface-2);color:var(--muted)}
.banner{background:var(--yellow);color:var(--dark);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin:12px 0}
/* pills / chips */
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--ink)}
.pill.paid{background:var(--green);color:var(--dark)} .pill.unpaid{background:var(--yellow);color:var(--dark)}
.pill.trial{background:var(--purple);color:#fff} .pill.already,.pill.info{background:var(--cyan);color:var(--dark)}
.pill.guest{background:var(--surface-2);color:var(--cyan);border:1px solid var(--cyan)}
.chip{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 15px var(--body);cursor:pointer}
.chip.selected,.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--pink);color:#fff;font:700 16px var(--body);cursor:pointer;text-decoration:none}
.btn:active{filter:brightness(.9)}
.btn.block{display:flex;width:100%}
.btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.btn.good{background:var(--green);color:var(--dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:400 16px var(--body)}
textarea{min-height:96px}
input::placeholder{color:var(--muted)}
label{display:block;margin:12px 0 6px}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 2px rgba(248,23,127,.35)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:600}
th,td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.error{background:rgba(248,23,127,.15);border:1px solid var(--pink);color:var(--ink);border-radius:12px;padding:12px 14px;margin:12px 0}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-block}
</style>

<style>
.hello{margin:4px 0 0}
.hello h1{font-size:44px}
.status .zh{font-size:22px;font-weight:700;margin-top:6px}
.status .big{font-family:var(--display);font-size:34px;margin-top:10px;letter-spacing:.03em}
.status .by{margin-top:10px;font-size:14px;font-weight:700;opacity:.85}
.status.noclass .word{font-size:44px}
.status.noclass .sub{color:var(--ink)}
.cibtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:112px;margin:12px 0;padding:14px 16px;border:0;border-radius:14px;background:var(--pink);color:#fff;cursor:pointer;text-align:center}
.cibtn .t{font-family:var(--display);font-size:34px;line-height:1.05;letter-spacing:.02em}
.cibtn .z{font-size:20px;font-weight:700;margin-top:4px}
.cibtn:active{filter:brightness(.9)} .cibtn:disabled{opacity:.6}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:14px;margin:8px 0;font-weight:600}
.opt b{font-family:var(--display);font-size:28px;color:var(--yellow);font-weight:400;white-space:nowrap}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(0,0,0,.15);border-top-color:currentColor;margin:4px auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fit-card{text-align:center}
.fit-card .code{font-family:var(--display);font-size:44px;line-height:1}
.qrbox{background:#fff;border-radius:14px;padding:10px;display:inline-block;margin:12px 0 4px;line-height:0;width:280px;max-width:100%}
.qrbox canvas{width:100%;height:auto;aspect-ratio:1/1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.tt div{padding:6px 0;text-align:left}
/* skeleton (first paint before the card arrives) */
.sk{background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}
.sk.l1{height:14px;width:30%;margin:8px 0}.sk.l2{height:40px;width:60%;margin:6px 0 14px}.sk.blk{height:112px;margin:12px 0}.sk.qr{height:280px;width:280px;max-width:100%;margin:12px auto}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
</style>
</head>
<body>
<style>
.hdr{position:sticky;top:0;z-index:40;background:var(--bg);margin:0 0 12px}
.hdr-stripe{height:6px;background:linear-gradient(105deg,var(--pink) 0 25%,var(--purple) 25% 50%,var(--cyan) 50% 75%,var(--yellow) 75%)}
.hdr-bar{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:8px 16px;min-height:52px;border-bottom:1px solid var(--line)}
.hdr-logo{width:36px;height:36px;border-radius:8px;flex:0 0 36px}
.hdr-name{flex:1;min-width:0;font-family:var(--display);font-size:20px;letter-spacing:.08em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr-slot{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdr.wide .hdr-bar{max-width:1100px}

var HOLD = 0; // R78: a check-in answer stays on screen (shown at the door) for 2 minutes before an automatic update may reload
window.FDA_busy = function(){ return !!RID || Date.now() < HOLD; };

var VIEW = {
  PAID:    {cls:'paid',    word:'PAID ✓',             zh:'已付款'},
  TRIAL:   {cls:'trial',   word:'FREE TRIAL',         zh:'免费体验'},
  UNPAID:  {cls:'unpaid',  word:'PAYMENT NEEDED',     zh:'请付款'},
  ALREADY: {cls:'already', word:'ALREADY CHECKED IN', zh:'已签到'},
  NO_CLASS:{cls:'noclass', word:'NO CLASS NOW',       zh:'现在没有课'}
};
var NET_ERR = 'We could not reach the studio system. Please check your internet and try again.';

function problem(d){
  var err = !d || d.kind !== 'UNKNOWN';
  $app.setAttribute('aria-busy','false');
  $app.innerHTML='<div class="card center"><h2>'+(err?'Oops':'QR not active')+'</h2><p>'+esc((d&&d.message)||'Something went wrong. Please see the counter.')+'</p><p class="muted">'+(err?'请再试一次，或到柜台':'此二维码已失效，请到柜台')+'</p>'+(err?'<button class="btn block" id="again">Try again 再试一次</button>':'')+'</div>';
  var b=document.getElementById('again'); if(b) b.onclick=load;
}

/* ---- the card (always shown under the action area) ---- */
function cardHtml(c){
  var h='<div class="card fit-card"><span class="label">My FIT card · 我的会员卡</span>';
  h+='<h2 style="margin-top:6px">'+esc(c.name)+'</h2><div class="code">'+esc(c.code)+'</div>';
  h+='<div class="qrbox"><canvas id="qr" width="560" height="560" role="img" aria-label="My QR code"></canvas></div>';
  h+='<p class="muted" style="margin:4px 0 12px;font-size:14px">Screenshot this and show it at the door.<br>截图保存，上课时出示即可。</p>';
  h+='<div class="kv"><span>Plan this month</span><b id="kvPlan">'+esc(c.planLabel)+'</b></div>';
  if(c.paidUntil)h+='<div class="kv"><span>Paid until</span><b>'+esc(c.paidUntil)+'</b></div>'; /* R70: a month label only */
  if(c.attendedThisMonth!=null)h+='<div class="kv"><span>Classes attended'+(c.monthLabel?' ('+esc(c.monthLabel)+')':' this month')+'</span><b id="kvAtt">'+esc(c.attendedThisMonth)+'</b></div>'; /* R77: no row on Unlimited */
  if(c.window && !c.window.open && c.window.nextClassLabel) h+='<div class="kv"><span>Next class</span><b>'+esc(c.window.nextClassLabel)+'</b></div>';
  h+='</div>';
  if(c.timetable && c.timetable.length){
    h+='<div class="card"><span class="label">Class times · 上课时间</span><div class="tt">';
    c.timetable.forEach(function(t){h+='<div>'+esc(t)+'</div>';});
    h+='</div></div>';
  }
  return h;
}
function bdayHtml(on){ return on?'<div class="banner">🎂 Happy birthday month! 生日快乐！10% off every plan this month.</div>':''; }

function actionHtml(c){
  if(c.checkedIn) return '<div class="status already"><div class="word">'+VIEW.ALREADY.word+'</div><div class="zh">'+VIEW.ALREADY.zh+'</div><div class="sub">Checked in at '+esc(c.checkedIn.time)+'</div></div>';
  if(c.autoCheckIn) return busyHtml(c.staffName);
  if(c.window && c.window.open) return '<button type="button" class="cibtn" id="ciBtn"><span class="t">'+esc(c.window.buttonLabel)+'</span><span class="z">签到</span></button>';
  return '<div class="status noclass"><div class="word">'+VIEW.NO_CLASS.word+'</div><div class="zh">'+VIEW.NO_CLASS.zh+'</div><div class="sub">'+esc((c.window&&c.window.opensLabel)||'')+'</div></div>';
}
function busyHtml(by){ return '<div class="status already" role="status"><div class="spin"></div><div class="word" style="font-size:44px">CHECKING IN…</div><div class="zh">正在签到</div>'+(by?'<div class="by">Scanned by '+esc(by)+'</div>':'')+'</div>'; }

function showCard(c){
  if(!c || c.kind!=='CARD'){ problem(c); return; }
  CARD=c;
  $app.setAttribute('aria-busy','false');
  $app.innerHTML='<div class="hello"><span class="label">Hi 你好</span><h1>'+esc(c.firstName||c.name)+'</h1></div>'+
    '<div id="act">'+actionHtml(c)+'</div><div id="bday">'+bdayHtml(c.birthday)+'</div>'+cardHtml(c);
  drawQr(c.cardLink || c.qrLink);
  var b=document.getElementById('ciBtn'); if(b) b.onclick=function(){ checkIn(null); };
  if(c.autoCheckIn) checkIn(STAFF);
}

/* ---- check in (R51): the same requestId is reused when the person taps "Try again" after a dropped connection ---- */
function checkIn(session){
  var act=document.getElementById('act');
  if(!RID) RID=newReqId();
  act.innerHTML=busyHtml(session?CARD.staffName:'');
  google.script.run
    .withSuccessHandler(function(r){ showStatus(r, session); })
    .withFailureHandler(function(){
      act.innerHTML='<div class="error">'+esc(NET_ERR)+'<br><span class="muted">网络有问题，请再试一次</span></div><button type="button" class="btn block" id="retry">Try again 再试一次</button>';
      document.getElementById('retry').onclick=function(){ checkIn(session); };
    })
    .door_memberCheckIn(TOKEN, session, RID);
}
function showStatus(d, session){
  if(!d || d.kind==='UNKNOWN' || d.kind==='ERROR'){ problem(d); return; }
  RID=''; HOLD=Date.now()+120000;
  var v=VIEW[d.kind]||VIEW.NO_CLASS, h='';
  h+='<div class="status '+v.cls+'"><div class="word">'+v.word+'</div><div class="zh">'+v.zh+'</div>';
  if(d.classLabel) h+='<div class="sub" style="font-weight:500">'+esc(d.classLabel)+'</div>';
  if(d.kind==='PAID') h+='<div class="big">'+(d.visitNo?'Class '+esc(d.visitNo)+' this month':'Enjoy the class!')+'</div>';
  else if(d.kind==='UNPAID') h+='<div class="sub">Please pay at the counter · 请到柜台付款</div>';
  else if(d.kind==='TRIAL') h+='<div class="sub">Welcome! Your first class is on us. 欢迎！</div>';
  else if(d.kind==='ALREADY') h+='<div class="sub">'+esc(d.message)+'</div>';
  else h+='<div class="sub">'+(d.nextClassLabel?'Next class: '+esc(d.nextClassLabel):esc(d.message))+'</div>';
  if(d.by && d.by!=='member') h+='<div class="by">Scanned by '+esc(d.by)+'</div>';
  h+='</div>';
  if(d.kind==='UNPAID' && d.options && d.options.length){
    h+='<div class="card"><span class="label">Choose one · 任选其一</span>';
    d.options.forEach(function(o){h+='<div class="opt"><span>'+esc(o.label)+'</span><b>'+esc(o.amount)+'</b></div>';});
    h+='</div>';
  }
  document.getElementById('act').innerHTML=h;
  document.getElementById('bday').innerHTML=bdayHtml(d.birthday || (CARD&&CARD.birthday));
  var p=document.getElementById('kvPlan'), a=document.getElementById('kvAtt');
  if(p && d.planLabel) p.textContent=d.planLabel;
  if(a && d.attendedThisMonth!=null) a.textContent=d.attendedThisMonth;
  else if(a && d.attendedThisMonth==null && a.parentNode && a.parentNode.parentNode) a.parentNode.parentNode.removeChild(a.parentNode); /* R77: now Unlimited (topped up after the card was painted): no count row */
  window.scrollTo(0,0);
}

/* ---- QR with the logo in the centre (level H leaves room for it). The library loads async (R60e): draw when both are here. ---- */
function qrLoaded(failed){ QR_STATE = failed ? 'failed' : 'ready'; if(QR_LINK) drawQr(QR_LINK); }
function drawQr(link){
  QR_LINK = link || '';
  var cv=document.getElementById('qr');
  if(!cv||!link) return;
  if(typeof qrcode!=='function'){ if(QR_STATE==='failed') cv.outerHTML='<div style="line-height:1.4;color:#000;padding:8px;word-break:break-all">'+esc(link)+'</div>'; return; }
  try{
    var q=qrcode(0,'H'); q.addData(link); q.make();
    var n=q.getModuleCount(), size=cv.width, quiet=2, cell=Math.floor(size/(n+quiet*2)), off=Math.floor((size-cell*n)/2);
    var g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,size,size); g.fillStyle='#000';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect(off+c*cell,off+r*cell,cell,cell);
    var img=document.querySelector('img.hdr-logo')||document.querySelector('img.logo');
    var ls=Math.round(size*0.22), lx=Math.round((size-ls)/2);
    var put=function(){ g.fillStyle='#fff'; g.fillRect(lx-6,lx-6,ls+12,ls+12); try{g.drawImage(img,lx,lx,ls,ls);}catch(e){} };
    if(img && img.complete) put(); else if(img) img.onload=put;
  }catch(e){ cv.outerHTML='<div style="color:#000;word-break:break-all;padding:8px">'+esc(link)+'</div>'; }
}

function load(){
  if(!TOKEN){ $app.setAttribute('aria-busy','false'); $app.innerHTML='<div class="card center"><h2>Welcome to FIT Dance Academy</h2><p>Please scan your personal QR code to open your card.</p><p class="muted">请扫描您的专属二维码</p></div>'; return; }
  google.script.run
    .withSuccessHandler(showCard)
    .withFailureHandler(function(){ problem({kind:'ERROR',message:NET_ERR}); })
    .door_memberCard(TOKEN, STAFF);
}
if (typeof qrcode === 'function') QR_STATE = 'ready';
load();
</script>
<script>
/* R66 - "Add to Home Screen" hint (what the old launcher/ pages said), as a small button in the shared header, only in a browser
   tab (never in the installed app: display-mode: standalone / navigator.standalone). Tapping it opens a short sheet with the
   iPhone / Android steps; on Android Chrome it can also offer the real install prompt. "Hide this" remembers on this phone. */
(function () {
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var HIDE = 'fda_install_hint_off';
  function hidden() { try { return localStorage.getItem(HIDE) === '1'; } catch (e) { return false; } }
  if (standalone || hidden()) return;
  var prompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; });
  var css = document.createElement('style');
  css.textContent = '.a2hs-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line,#2e2a38);background:transparent;color:var(--muted,#a8a3b5);font:600 12px/1 var(--body,system-ui,sans-serif);cursor:pointer;white-space:nowrap}' +
    '.a2hs-btn b{font-size:16px;color:var(--ink,#f6f6f6)}' +
    '.a2hs{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}' +
    '.a2hs .s{width:100%;max-width:480px;background:var(--surface,#17151d);border:1px solid var(--line,#2e2a38);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;font-size:15px;color:var(--ink,#f6f6f6)}' +
    '.a2hs .s p{margin:0;color:var(--muted,#a8a3b5)} .a2hs .s b{color:var(--ink,#f6f6f6)}' +
    '.a2hs .row2{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:4px}' +
    '.a2hs button{min-height:44px;border-radius:12px;border:0;padding:0 16px;font:700 15px var(--body,system-ui,sans-serif);cursor:pointer}' +
    '.a2hs .ok{background:var(--pink,#f8177f);color:#fff} .a2hs .no{background:transparent;color:var(--muted,#a8a3b5);text-decoration:underline}';
  document.head.appendChild(css);

  function open() {
    var d = document.createElement('div');
    d.className = 'a2hs'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Add to Home Screen');
    d.innerHTML = '<div class="s"><div><b>Add the FIT icon to your home screen · 添加到主屏幕</b></div>' +
      '<p><b>iPhone (Safari):</b> tap Share ⬆︎ → Add to Home Screen → Add.<br>点 分享 → 添加到主屏幕。</p>' +
      '<p><b>Android (Chrome):</b> tap ⋮ → Add to Home screen (or Install app) → Add.<br>点 ⋮ → 添加到主屏幕。</p>' +
      '<p>Then always open it from the FIT icon. · 以后从 FIT 图标打开。</p>' +
      '<div class="row2"><button type="button" class="no" data-a="hide">Hide this · 隐藏</button>' +
      (prompt ? '<button type="button" class="ok" data-a="install">Install</button>' : '<button type="button" class="ok" data-a="close">OK</button>') + '</div></div>';
    d.addEventListener('click', function (e) {
      var a = e.target && e.target.getAttribute && e.target.getAttribute('data-a');
      if (e.target === d || a === 'close') d.remove();
      else if (a === 'hide') { try { localStorage.setItem(HIDE, '1'); } catch (x) { /* ignore */ } d.remove(); var b = document.getElementById('a2hsBtn'); if (b) b.remove(); }
      else if (a === 'install' && prompt) { prompt.prompt(); prompt = null; d.remove(); }
    });
    document.body.appendChild(d);
  }
  function mount() {
    var bar = document.querySelector('.hdr-bar');
    if (!bar || document.getElementById('a2hsBtn')) return;
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'a2hsBtn'; b.className = 'a2hs-btn'; b.setAttribute('aria-label', 'Add to Home Screen');
    b.innerHTML = '<b aria-hidden="true">＋</b>App';
    b.onclick = open;
    bar.appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<script>window.FDA_SITE_ROOT="";
/* R78 - "updates show immediately" (inlined at the end of every page by deploy/build-site.js, after window.FDA_BUILD and
   window.FDA_SITE_ROOT). Registers the service worker, then checks <site>/version.json (network only: the worker never touches it)
   on open, when the page comes back to the front, when the phone gets signal again, every few minutes while visible, and when a new
   worker takes over. A different build id = a newer app is published:
   - at a safe moment (no unsent outbox items, no server call in flight, no focused or edited field, no open sheet/dialog, the page
     itself not busy) the page reloads itself once - the worker is network-first for pages, so the reload gets the new app;
   - otherwise a small "New version — tap to update" bar shows, and the page keeps trying for the safe moment.
   A reload for a build that still serves the old page (the CDN has not caught up) does not loop: that build only shows the bar. */
(function (root) {
  var doc = root.document, nav = root.navigator;
  var BUILD = String(root.FDA_BUILD || '');
  var BASE = String(root.FDA_SITE_ROOT || '');
  var EVERY = 5 * 60000, RETRY = 3000, MARK = 'fda_reloaded_for';
  var st = { latest: '', bar: null, timer: null, checking: false, hadController: false };

  // the "already reloaded for build X" mark: sessionStorage, else window.name (same tab, survives the reload) - never a loop
  function wnGet(k) { var m = String(root.name || '').match(new RegExp('(?:^|;)' + k + '=([0-9a-f]+)')); return m ? m[1] : ''; }
  function wnSet(k, v) { try { root.name = String(root.name || '').replace(new RegExp('(?:^|;)' + k + '=[0-9a-f]*'), '') + ';' + k + '=' + v; } catch (e) { /* ignore */ } }
  function ssGet(k) { var v = ''; try { v = root.sessionStorage.getItem(k) || ''; } catch (e) { v = ''; } return v || wnGet(k); }
  function ssSet(k, v) { try { root.sessionStorage.setItem(k, v); } catch (e) { wnSet(k, v); } }
  function shown(el) {
    if (!el || (el.classList && el.classList.contains('hidden')) || el.hidden) return false;
    if (typeof el.getClientRects === 'function') return el.getClientRects().length > 0;
    return true;
  }
  function edited(el) {
    var t = String(el.type || '').toLowerCase();
    if (t === 'hidden' || t === 'button' || t === 'submit' || t === 'reset' || t === 'image') return false;
    if (t === 'checkbox' || t === 'radio') return el.checked !== el.defaultChecked;
    if (el.options) { // a select with no default option shows its first one: that is not an edit
      var o = el.options, def = -1, i;
      for (i = 0; i < o.length; i++) if (o[i].defaultSelected) { def = i; break; }
      if (!el.multiple) return o.length > 0 && el.selectedIndex !== (def < 0 ? 0 : def);
      for (i = 0; i < o.length; i++) if (o[i].selected !== o[i].defaultSelected) return true;
      return false;
    }
    return String(el.value == null ? '' : el.value) !== String(el.defaultValue == null ? '' : el.defaultValue);
  }

  function unsaved() { try { return !!(root.FDAStore && typeof root.FDAStore.unsaved === 'function' && root.FDAStore.unsaved()); } catch (e) { return true; } }
  /** Why now is not a safe moment to reload ('' = safe). */
  function blocker() {
    try { if (typeof root.FDA_rpcBusy === 'function' && root.FDA_rpcBusy() > 0) return 'call'; } catch (e) { return 'call'; }
    try { if (root.FDAStore && typeof root.FDAStore.busy === 'function' && root.FDAStore.busy()) return 'outbox'; } catch (e) { return 'outbox'; }
    try { if (typeof root.FDA_busy === 'function' && root.FDA_busy()) return 'page'; } catch (e) { return 'page'; }
    if (!doc) return '';
    var a = doc.activeElement;
    if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(String(a.tagName || '').toUpperCase()) || a.isContentEditable)) return 'typing';
    var dl = doc.querySelectorAll ? doc.querySelectorAll('[role="dialog"],[aria-modal="true"],dialog[open]') : [];
    for (var i = 0; i < dl.length; i++) if (shown(dl[i])) return 'dialog';
    var f = doc.querySelectorAll ? doc.querySelectorAll('input,textarea,select') : [];
    for (var j = 0; j < f.length; j++) if (shown(f[j]) && edited(f[j])) return 'form';
    return '';
  }

  function reload() {
    ssSet(MARK, st.latest);
    try { root.location.reload(); } catch (e) { /* ignore */ }
  }
  function hideBar() { if (st.bar && st.bar.parentNode) st.bar.parentNode.removeChild(st.bar); st.bar = null; }
  function showBar() {
    if (st.bar || !doc || !doc.body) return;
    var b = doc.createElement('button');
    b.type = 'button'; b.id = 'fdaUpdate'; b.setAttribute('role', 'status');
    b.setAttribute('style', 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:95;' +
      'max-width:calc(100% - 32px);min-height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--pink,#f8177f);color:#fff;' +
      'font:700 14px/1.2 var(--body,system-ui,sans-serif);box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:pointer');
    b.textContent = 'New version — tap to update · 有新版本';
    // a tap reloads (the persisted outbox survives it) - but waits for calls in flight and memory-only entries (a Join registration)
    b.onclick = function () { b.disabled = true; b.textContent = 'Updating…'; (function go() { if (blocker() === 'call' || unsaved()) root.setTimeout(go, 300); else reload(); })(); };
    doc.body.appendChild(b);
    st.bar = b;
  }
  /** A newer build is out: reload now if safe (once per build), else show the bar and keep trying. */
  function apply() {
    if (!st.latest) return;
    if (st.timer) { root.clearTimeout(st.timer); st.timer = null; }
    var tried = ssGet(MARK) === st.latest; // already reloaded for this build and still old: no loop, the bar only
    if (!tried && !blocker()) { reload(); return; }
    showBar();
    if (!tried) st.timer = root.setTimeout(apply, RETRY);
  }
  function newer(build) { build = String(build || ''); return !!(build && BUILD && build !== BUILD); }
  /** Fetch <site>/version.json past every cache; resolves true when a newer build was found. */
  function check() {
    if (st.checking || typeof root.fetch !== 'function') return Promise.resolve(false);
    st.checking = true;
    return root.fetch(BASE + 'version.json?t=' + Date.now(), { cache: 'no-store', credentials: 'omit' })
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (j) {
        st.checking = false;
        if (j && newer(j.build)) { st.latest = String(j.build); apply(); return true; }
        if (j && String(j.build || '') === BUILD) { st.latest = ''; hideBar(); }
        return false;
      }, function () { st.checking = false; return false; });
  }

  function start() {
    if (nav && nav.serviceWorker && typeof nav.serviceWorker.register === 'function') {
      st.hadController = !!nav.serviceWorker.controller;
      nav.serviceWorker.addEventListener('controllerchange', function () {
        if (st.hadController) check(); // a new worker took over (a new build): confirm with version.json, then reload / bar
        st.hadController = true;
      });
      nav.serviceWorker.register(BASE + 'sw.js').then(function (reg) { if (reg && typeof reg.update === 'function') { try { reg.update(); } catch (e) {} } }, function () {});
    }
    check();
    if (doc && doc.addEventListener) doc.addEventListener('visibilitychange', function () { if (doc.visibilityState === 'visible') check(); });
    if (root.addEventListener) root.addEventListener('online', function () { check(); });
    root.setInterval(function () { if (!doc || doc.visibilityState !== 'hidden') check(); }, EVERY);
  }

  root.FDAUpdate = { check: check, blocker: blocker, safe: function () { return !blocker(); }, newer: newer, build: BUILD, _state: st, _start: start };
  if (root.FDA_UPDATE_MANUAL) return; // tests drive it by hand
  if (doc && doc.readyState === 'complete') start(); else if (root.addEventListener) root.addEventListener('load', start);
})(typeof window !== 'undefined' ? window : this);
</script>
