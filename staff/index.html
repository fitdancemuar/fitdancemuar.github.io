<script>
/* R66 - google.script.run over fetch, for the static pages on fitdancemuar.github.io (inlined into each page by deploy/build-site.js).
   Same chaining API as Apps Script: google.script.run.withSuccessHandler(ok).withFailureHandler(fail).withUserObject(o).fn(...args).
   Each call POSTs {"fn","args"} to window.FDA_API_URL (the Door /exec link, baked at build time) as text/plain (no CORS preflight),
   credentials omitted (no Google cookies, so several signed-in Google accounts no longer matter), redirects followed (Apps Script
   answers via a 302 to script.googleusercontent.com). Server answer {ok:true,result} -> ok(result, userObject);
   {ok:false,error:{code,message}} -> fail(Error(message)) with err.code (AUTH / NO_ACTOR / NO_SHEET keep the message the pages test);
   no answer / HTTP error / not our JSON -> fail(Error('NetworkError: …')) so the outbox keeps the change and retries.
   Never replaces a real google.script.run (inside Apps Script the native one stays). */
(function (root) {
  if (root.google && root.google.script && root.google.script.run) return;
  var LONG = { partners_runSetup: 1, partners_runImport: 1, partners_monthlyReport: 1, partners_archive: 1, partners_statementPdf: 1, partners_healthCheck: 1, partners_repairData: 1 };
  var NET = 'NetworkError: Connection failure due to HTTP 0';

  function netErr() { var e = new Error(NET); e.code = 'NETWORK'; return e; }
  function decode(status, okHttp, text) {
    if (!okHttp) return { fail: netErr() };
    var j;
    try { j = JSON.parse(text); } catch (e) { return { fail: netErr() }; }
    if (!j || typeof j !== 'object' || typeof j.ok !== 'boolean') return { fail: netErr() };
    if (j.ok) return { value: j.result === undefined ? null : j.result };
    var er = j.error || {};

  }
  function later(fn) { root.setTimeout(function () { throw fn; }, 0); }

  function send(name, args, ok, fail, user) {
    var body;
    try { body = JSON.stringify({ fn: name, args: args }); } catch (e) { body = null; }
    var url = root.FDA_API_URL;
    var ctl = null, timer = null;
    try { if (typeof root.AbortController === 'function') ctl = new root.AbortController(); } catch (e) { ctl = null; }
    var init = { method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body };
    if (ctl) { init.signal = ctl.signal; timer = root.setTimeout(function () { try { ctl.abort(); } catch (e) { /* ignore */ } }, LONG[name] ? 360000 : 90000); }
    var p;
    if (body === null || !url || typeof root.fetch !== 'function') p = Promise.resolve({ fail: body === null ? new Error('These details could not be sent.') : netErr() });
    else {
      p = root.fetch(url, init).then(function (res) {
        return res.text().then(function (t) { return decode(res.status, res.ok, t); }, function () { return { fail: netErr() }; });
      }, function () { return { fail: netErr() }; });
    }
    p.then(function (out) {
      if (timer) root.clearTimeout(timer);
      try {
        if (out.fail) { if (fail) fail(out.fail, user); else if (root.console) root.console.error('[rpc] ' + name + ': ' + out.fail.message); }
        else if (ok) ok(out.value, user);

    });

  function runner(ok, fail, user) {
    var api = {
      withSuccessHandler: function (f) { return runner(f, fail, user); },
      withFailureHandler: function (f) { return runner(ok, f, user); },
      withUserObject: function (o) { return runner(ok, fail, o); }

<style>
:root{
  --bg:#0b0a0f; --surface:#17151d; --surface-2:#221f2b; --line:#2e2a38;
  --ink:#f6f6f6; --muted:#a8a3b5;
  --pink:#f8177f; --purple:#895cff; --cyan:#39cbf0; --yellow:#ffe047; --green:#2ee59d; --grey:#6e6880;
  --dark:#0b0a0f;
  --display:"Bebas Neue","Oswald",Impact,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
.wrap.wide{max-width:1100px}
/* signature top bar: four diagonal segments pink > purple > cyan > yellow */
.topbar{height:6px;margin:0 -16px 16px;background:linear-gradient(105deg,var(--pink) 0 25%,var(--purple) 25% 50%,var(--cyan) 50% 75%,var(--yellow) 75%)}
.logo{display:block;width:120px;height:120px;margin:8px auto 12px;border-radius:14px}
h1,h2,h3,.display{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;line-height:1.05}
h1{font-size:40px} h2{font-size:30px} h3{font-size:22px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.25em;color:var(--muted)}
.muted{color:var(--muted)} .center{text-align:center} .hidden{display:none!important}
a{color:var(--pink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-3{grid-template-columns:repeat(3,1fr)}}
/* big status block */
.status{border-radius:14px;padding:28px 16px;text-align:center;color:var(--dark);margin:12px 0}
.status .word{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:.03em}
.status .sub{font-size:17px;font-weight:600;margin-top:8px}
.status.paid{background:var(--green)} .status.unpaid{background:var(--yellow)}
.status.trial{background:var(--purple)} .status.already{background:var(--cyan)}
.status.noclass{background:var(--surface-2);color:var(--muted)}
.banner{background:var(--yellow);color:var(--dark);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin:12px 0}
/* pills / chips */
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--ink)}
.pill.paid{background:var(--green);color:var(--dark)} .pill.unpaid{background:var(--yellow);color:var(--dark)}
.pill.trial{background:var(--purple);color:#fff} .pill.already,.pill.info{background:var(--cyan);color:var(--dark)}
.pill.guest{background:var(--surface-2);color:var(--cyan);border:1px solid var(--cyan)}
.chip{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 15px var(--body);cursor:pointer}
.chip.selected,.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--pink);color:#fff;font:700 16px var(--body);cursor:pointer;text-decoration:none}
.btn:active{filter:brightness(.9)}
.btn.block{display:flex;width:100%}
.btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.btn.good{background:var(--green);color:var(--dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:400 16px var(--body)}
textarea{min-height:96px}
input::placeholder{color:var(--muted)}
label{display:block;margin:12px 0 6px}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 2px rgba(248,23,127,.35)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:600}
th,td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.error{background:rgba(248,23,127,.15);border:1px solid var(--pink);color:var(--ink);border-radius:12px;padding:12px 14px;margin:12px 0}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-block}
</style>

<style>
html,body{overflow-x:hidden}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.keypad button{min-height:68px;font:400 36px var(--display);border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.keypad button:active{background:var(--pink)}
.dots{display:flex;justify-content:center;gap:14px;min-height:28px;margin:18px 0 4px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--pink)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums .card{text-align:center;margin:0}
.nums .n{font-family:var(--display);font-size:44px;line-height:1;margin-top:4px}
.money .big{font-family:var(--display);font-size:40px;line-height:1;margin:4px 0 8px}
.money .lines{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}
.money .lines div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.money .lines b{color:var(--ink);font-weight:600}
.money .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;margin-top:6px}
.person{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:8px 0;min-height:56px}
.person .who{flex:1;min-width:0}
.person .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.person .btn{min-height:48px;padding:0 14px;flex:0 0 auto}
.person.pending{opacity:.7;border:1px dashed var(--line)}
.hn{font-size:11px;font-weight:700;color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.pill{white-space:nowrap;flex:0 0 auto}
.pill.imported{background:var(--grey);color:#fff}
.pill.void{background:transparent;color:var(--muted);border:1px solid var(--line);text-decoration:line-through}
.pill.wait{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:6px 0}
.seg button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:700 15px var(--body);cursor:pointer;padding:0 6px}
.seg button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.optcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.optcard b{font-family:var(--display);font-weight:400;font-size:30px;white-space:nowrap}
.optcard.on{border-color:var(--pink);background:rgba(248,23,127,.14)}
.toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:456px;margin:0 auto;background:var(--green);color:var(--dark);font-weight:700;border-radius:12px;padding:14px 16px;text-align:center;z-index:60}
.toast.err{background:var(--pink);color:#fff}
.sec-title{margin:16px 0 4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row>div{min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;padding:12px;background:var(--surface-2);border-radius:12px}
.check input{width:28px;height:28px;min-height:0;flex:0 0 28px;margin:0}
.check label{margin:0}
.status .zh{font-size:20px;font-weight:700;margin-top:4px}
.status .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.8}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:6px}
.clsrow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.clsrow .chip{flex:0 0 auto;flex-direction:column;align-items:flex-start;justify-content:center;min-height:56px;padding:6px 14px;border-radius:14px;line-height:1.15}
.clsrow .chip small{font-weight:500;font-size:12px;opacity:.8}
.cls{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:60px;padding:10px 14px;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.cls small{display:block;color:var(--muted);font-weight:400}
.cls .go{color:var(--cyan);font-size:22px}
.actions{display:flex;gap:8px;margin:0 0 8px}
.actions .btn{flex:1;min-height:48px}
.ask{background:var(--surface);border:1px solid var(--pink);border-radius:12px;padding:12px;margin:-2px 0 10px}
textarea{width:100%;min-height:72px;box-sizing:border-box}
.btn.danger{background:var(--pink);color:#fff}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.notice{background:rgba(57,203,240,.12);border:1px solid var(--cyan);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:16px 0}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.counts .pill{font-size:11px;padding:2px 8px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:12px 0}
.sum b{font-family:var(--display);font-size:34px;font-weight:400;color:var(--green)}
/* sync chip (in the shared header's #hdr-slot) + offline bar + status sheet */
.sync{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 8px}
.sync.saving i{background:var(--yellow)} .sync.offline i{background:var(--pink)} .sync.offline{border-color:var(--pink)}
.offbar{background:var(--yellow);color:var(--dark);font-weight:700;font-size:14px;text-align:center;padding:8px 16px;margin:-12px 0 12px}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:85vh;overflow:auto;padding:16px 16px 24px}
.skel{height:56px;border-radius:12px;margin:8px 0;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.tabs{display:flex;flex-wrap:nowrap;gap:8px;padding:4px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs .chip{flex:0 0 auto;justify-content:center;min-height:48px;padding:0 16px;font-size:15px;white-space:nowrap;scroll-snap-align:start}
</style>
</head>
<body>
<style>
.hdr{position:sticky;top:0;z-index:40;background:var(--bg);margin:0 0 12px}
.hdr-stripe{height:6px;background:linear-gradient(105deg,var(--pink) 0 25%,var(--purple) 25% 50%,var(--cyan) 50% 75%,var(--yellow) 75%)}
.hdr-bar{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:8px 16px;min-height:52px;border-bottom:1px solid var(--line)}
.hdr-logo{width:36px;height:36px;border-radius:8px;flex:0 0 36px}
.hdr-name{flex:1;min-width:0;font-family:var(--display);font-size:20px;letter-spacing:.08em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr-slot{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdr.wide .hdr-bar{max-width:1100px}
</style>

    var out = []; for (var i = 0; i < 12; i++) out.push(E.addMonths(ym, i)); return out;
  }
  /** Engine.advancePlan for a page: a = {member:{code, bday_month}, plan, months, start, promo (page shape) | null, settings (Engine keys)} */
  function quote(a) {
    var p = a.promo ? { name: a.promo.name, plan: a.promo.plan, months: a.promo.months, total_price: a.promo.total, birthday_combines: a.promo.birthdayCombines } : null;
    return root.Engine.advancePlan({ member: a.member, plan: a.plan, months: Number(a.months), start: a.start, settings: a.settings, promo: p });
  }
  /** months of the quote that already have a payment (paidMonths: ['YYYY-MM']) */
  function clashes(q, paidMonths) {
    var have = {}; (paidMonths || []).forEach(function (m) { have[m] = true; });
    return ((q && q.months) || []).filter(function (m) { return have[m]; });
  }
  /** R73 "Already paid before go-live": the same months at RM0 collected, the month's value as rebate (as the server writes them) */
  function prepaid(q) {
    if (!q || q.error) return q;
    var out = JSON.parse(JSON.stringify(q));

  /** the price breakdown table: one line per month, the promotion discount, the total */
  function breakdown(q, promo, paidMonths) {

      q.lines.forEach(function (l) {
        t += '<tr><td>' + esc(monthLabel(l.month)) + ' <small>' + plan0 + (l.birthday ? ' · 🎂 10% off' : '') + (clash0.indexOf(l.month) >= 0 ? ' · <b style="color:var(--pink)">already paid</b>' : ' · paid before go-live') + '</small></td><td class="n">' + E.fmtRM(l.value) + '</td></tr>';
      });
      t += '<tr class="disc"><td>Paid before go-live</td><td class="n">−' + E.fmtRM(q.value) + '</td></tr>';
      t += '<tr class="tot"><td>Collected now · covers ' + esc(monthsShort(q.months)) + '</td><td class="n">' + E.fmtRM(0) + '</td></tr></table>';
      if (clash0.length) t += '<div class="adv-warn">Already paid: ' + esc(clash0.map(monthLabel).join(', ')) + '. Choose a later first month or fewer months.</div>';
      return t;
    }
    var plan = q.plan === 'UNL' ? 'Unlimited' : 'Standard', h = '<table class="adv-bd">', clash = clashes(q, paidMonths);
    q.lines.forEach(function (l) {
      var price = promo ? l.value : l.amount;
      h += '<tr><td>' + esc(monthLabel(l.month)) + ' <small>' + plan + (l.birthday ? ' · 🎂 10% off' : '') + (clash.indexOf(l.month) >= 0 ? ' · <b style="color:var(--pink)">already paid</b>' : '') + '</small></td><td class="n">' + E.fmtRM(price) + '</td></tr>';
    });
    var disc = 0; q.lines.forEach(function (l) { disc += E.toSen(l.rebate); });
    if (promo && disc) h += '<tr class="disc"><td>Promo: ' + esc(promo.name) + '</td><td class="n">−' + E.fmtRM(E.fromSen(disc)) + '</td></tr>';
    h += '<tr class="tot"><td>Total · ' + q.lines.length + ' month' + (q.lines.length === 1 ? '' : 's') + '</td><td class="n">' + E.fmtRM(q.total) + '</td></tr></table>';
    if (clash.length) h += '<div class="adv-warn">Already paid: ' + esc(clash.map(monthLabel).join(', ')) + '. Choose a later first month or fewer months.</div>';
    return h;
  }
  /** "Oct, Nov, Dec 2026" */
  function monthsShort(months) {
    var n = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return (months || []).map(function (ym, i) { var nx = months[i + 1]; return n[+ym.slice(5, 7) - 1] + (!nx || nx.slice(0, 4) !== ym.slice(0, 4) ? ' ' + ym.slice(0, 4) : ''); }).join(', ');
  }
  /** optimistic local rows of a bundle (replaced by the server's rows at the next sync) */
  function localRows(q, code, method, by, promo, id, ts) {
    return q.lines.map(function (l, i) {
      return { pay_id: 'L-' + id + '-' + i, _local: id, code: code, month: l.month, kind: q.plan, amount: l.amount, rebate: l.rebate, method: method, received_by: by,
        void: false, ts: ts, bundle_id: 'B' + id, promo_id: promo ? promo.promoId : '' };

  }

</script>

<script>
/* Peggy's console (R52, R55-R59, R61). Local-first: every screen paints from the copy on this phone (FDAStore, _store.html),

var KEY='fda_staff', NAME_KEY='fda_staff_name';

window.FDA_PERF={};
var session='', me='Peggy', st=null, tab='today', pin='', busy=false, selClass='';

var S={ q:'', ci:null, recent:[], pay:null, payQ:'', saved:null, receipt:null, guest:{name:'',method:'Cash',by:'',cls:''},
        ed:{list:null,cls:null,confirm:'',moving:'',q:'',busy:false}, hist:{open:''} };
var NM=null;
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function $(id){return document.getElementById(id);}

function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}

function toast(msg,err){if(window.FDAEdit&&FDAEdit.note&&document.body){FDAEdit.note(msg,err);return;} /* R72: one toast stack (never over Undo) */ var t=$('toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='toast hidden';},err?4500:2500);}
function rm(n){return Engine.fmtRM(n||0);}
function now(){return new Date();}
function ymNow(){return Engine.ymOf(now());}
function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;if(!m){y--;m=12;}return y+'-'+('0'+m).slice(-2);}
function monthLabel(ym){return MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function wd(ds){return WD[new Date(Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10))).getUTCDay()];}

function tsDate(ts){var d=Engine.parseTs(ts);return d?Engine.dateStr(d):'';}

function tsTime(ts){var d=Engine.parseTs(ts);return d?Engine.fmtTime(d):'';}
function people(n){return n+(n===1?' person':' people');}

/* ---- direct (read) calls: session first; AUTH -> PIN screen ---- */
function call(fn,args,ok,fail){
  var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(function(e){
    var m=String((e&&e.message)||e||'');
    if(m.indexOf('AUTH')>=0){ authLost(); return; }
    if(fail) fail(e); else toast('No signal. Try again in a moment.',true);
  });
  r[fn].apply(r,[session].concat(args||[]));
}

/* ================================================================ local data helpers */
function settings(){return (st&&st.get('settings'))||{};}
function ES(){var s=settings(),p=s.prices||{};return {PRICE_PER:p.per,PRICE_STD:p.std,PRICE_UNL:p.unl,STD_CLASSES:s.stdClasses,BIRTHDAY_DISCOUNT:s.birthdayDiscount,CHECKIN_OPEN_MIN:s.openMin,CHECKIN_CLOSE_MIN:s.closeMin};}
function methods(){return settings().methods||['Cash','TNG','Bank transfer'];}

function partners(){return settings().partners||['Cherrie','Pheon','Steffie'];}
function tngHolder(){return settings().tngHolder||'FIT TNG';}
function pricePer(){var p=settings().prices;return p&&p.per!=null?p.per:15;}
function defaultHolder(method){return method==='TNG'?tngHolder():me;}
function sessionsList(){return ((st&&st.get('sessions'))||[]).filter(function(x){return !x.cancelled;}).map(function(x){
  return {class_key:x.classKey,date:x.date,start:x.start,end:x.end,counts_for:x.countsFor||x.date.slice(0,7),kind:x.kind,instructor:x.instructor||''};});}
function sessionOf(key){var l=sessionsList();for(var i=0;i<l.length;i++)if(l[i].class_key===key)return l[i];return null;}
function todays(){var t=Engine.dateStr(now());return sessionsList().filter(function(x){return x.date===t;});}
function stateOf(x){var t=now().getTime(),s=Engine.sessionStartMs(x),e=Engine.sessionEndMs(x);return t>=e?'done':t>=s?'live':'later';}
function defaultClass(){var s=settings();var c=Engine.staffClass(now(),sessionsList(),s.openMin);if(c)return c.class_key;var l=todays();return l.length?l[l.length-1].class_key:'';}
/* classes Peggy may check people in to (R52): today, plus started classes this week */
function pickable(){var t=now().getTime(),today=Engine.dateStr(now()),ws=Engine.weekStart(today);
  return sessionsList().filter(function(x){return x.date===today||(x.date>=ws&&x.date<today&&Engine.sessionStartMs(x)<=t);});}
function members(){return (st&&st.get('members'))||{};}
function member(code){return members()[code]||null;}
function att(){return st?st.list('attendance'):[];}
function pays(){return st?st.list('payments'):[];}
function rowsFor(key){return att().filter(function(r){return r.class_key===key&&r.result!=='VOID';}).sort(function(a,b){return String(a.ts)<String(b.ts)?-1:1;});}
function voidRowsFor(key){return att().filter(function(r){return r.class_key===key&&r.result==='VOID';}).sort(function(a,b){return String(a.ts)<String(b.ts)?-1:1;});}
function nameOf(r){if(!r.code)return r.guest_name||r._name||'Guest';var m=member(r.code);return m?m.name:r.code;}
function memberPays(code,ym){return pays().filter(function(p){return p.code===code&&p.month===ym&&!p.void;});}
function visits(code,ym){return att().filter(function(r){return r.code===code&&r.plan_month===ym&&['VOID','TRIAL','GUEST','IMPORTED'].indexOf(r.result)<0;}).length;}
function statusLine(code){var ym=ymNow(),c=st.get('coverage')[code+'|'+ym],v=visits(code,ym),paid=c?c.paid:memberPays(code,ym).reduce(function(a,p){return a+Number(p.amount)+Number(p.rebate||0);},0);
  var plan=c&&c.covered===null?'Unlimited':paid>0?rm(paid)+' paid':'No payment yet';
  return plan+' · '+v+(v===1?' class':' classes');}
function money(dayOrMonth){ // {total, byMethod, byHolder} by payment date
  var out={total:0,byMethod:{},byHolder:{}};
  methods().forEach(function(m){out.byMethod[m]=0;});
  pays().forEach(function(p){ if(p.void||Engine.isPrepaidGoLive(p))return; var d=payDay(p); if(d.slice(0,dayOrMonth.length)!==dayOrMonth)return;
    var a=Number(p.amount)||0; out.total+=a; out.byMethod[p.method]=(out.byMethod[p.method]||0)+a; out.byHolder[p.received_by]=(out.byHolder[p.received_by]||0)+a; });
  return out;
}
function search(q){
  q=String(q||'').trim().toLowerCase(); if(!q)return [];
  var out=[]; var ms=members();
  Object.keys(ms).forEach(function(code){var m=ms[code],n=String(m.name||'').toLowerCase(),c=code.toLowerCase(),score=-1;
    if(c===q)score=0;else if(c.indexOf(q)===0)score=1;else if(n.indexOf(q)===0)score=2;else if(n.indexOf(' '+q)>=0)score=3;else if(n.indexOf(q)>=0)score=4;
    if(score>=0)out.push({s:score,m:m});});
  out.sort(function(a,b){return a.s-b.s||String(a.m.name).localeCompare(String(b.m.name));});
  return out.slice(0,20).map(function(x){return x.m;});
}
/* provisional check-in result with the shared Engine (R61): the server's answer replaces it */
function provisional(code,cls){
  var m=member(code)||{code:code}, ym=cls.counts_for, cov=st.get('coverage')[code+'|'+ym];
  var mine=att().filter(function(r){return r.code===code&&r.result!=='VOID';});
  var monthAtt=mine.filter(function(r){return r.plan_month===ym||r.class_key===cls.class_key;}).map(function(r){return {code:r.code,class_key:r.class_key,plan_month:r.plan_month,result:r.result,via:r.via,ts:r.ts};});
  var mp=memberPays(code,ym), carry=0;
  if(cov){ if(cov.covered===null)carry=9999; else { var base=Engine.coverage(m,ym,mp,0,ES()).covered; carry=Math.max(0,cov.covered-(base===Infinity?0:base)); } }
  return Engine.checkIn({member:{code:code,trial_used:m.trial_used,bday_month:m.bday_month},settings:ES(),monthAttendance:monthAtt,monthPayments:mp,carryClasses:carry,
    cls:{class_key:cls.class_key,date:cls.date,start:cls.start,end:cls.end,counts_for:cls.counts_for},everAttended:mine.length>0,now:now()});
}

/* ================================================================ PIN */
function drawKeypad(){
  var k=$('keypad'),h='';
  ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function(x){h+='<button type="button" data-k="'+x+'" aria-label="'+(x==='⌫'?'Delete':x==='OK'?'Enter':x)+'">'+x+'</button>';});
  k.innerHTML=h;
  k.onclick=function(e){var b=e.target.closest('button');if(!b)return;var x=b.getAttribute('data-k');
    if(x==='⌫')pin=pin.slice(0,-1);else if(x==='OK')return submitPin();else if(pin.length<8)pin+=x;
    drawDots();};
  drawDots();
}
function drawDots(){var h='';for(var i=0;i<pin.length;i++)h+='<i></i>';$('dots').innerHTML=h;}
function showPin(msg){ $('console').classList.add('hidden'); $('pinScreen').classList.remove('hidden'); $('hdr-slot').innerHTML=''; $('offbar').classList.add('hidden');
  $('pinMsg').textContent=msg||'Enter the PIN'; pin=''; drawDots(); }
function submitPin(){
  if(!pin||busy)return; busy=true; $('pinMsg').textContent='Checking…';
  google.script.run.withSuccessHandler(function(r){
    busy=false;
    if(r&&r.ok){session=r.session;me=r.name||'Peggy';lsSet(KEY,session);lsSet(NAME_KEY,me);pin='';drawDots();enter();}
    else{pin='';drawDots();$('pinMsg').textContent=(r&&r.error)||'Wrong PIN';}
  }).withFailureHandler(function(){busy=false;pin='';drawDots();$('pinMsg').textContent='No signal. Check the internet and try again.';}).door_login(pin);
}
function authLost(){ session=''; lsSet(KEY,null); showPin('Please enter the PIN again.'); }
function logout(){
  var s=session; session=''; lsSet(KEY,null); lsSet(NAME_KEY,null);
  if(s){try{google.script.run.withFailureHandler(function(){}).door_logout(s);}catch(e){}}
  var done=function(){ st=null; S.recent=[]; S.ci=null; S.pay=null; S.saved=null; NM=null; showPin(); };
  if(st){ st.close(); st.clear().then(done,done); } else done();
}

/* ================================================================ console + store */
function enter(){
  $('pinScreen').classList.add('hidden'); $('console').classList.remove('hidden');
  $('hdr-slot').innerHTML='<button type="button" class="sync" id="syncChip" aria-label="Sync status"><i></i><span>Saved</span></button>';
  $('syncChip').onclick=openSheet;
  drawTabs();
  if(st){ st.setSession(session,me); st.sync().catch(function(){}); paint(); return; }
  st=FDAStore.open({kind:'staff',session:session,owner:me,syncFn:'door_sync',autoSync:true});
  st.on('status',showStatus);
  st.on('change',function(x){ if(x&&x.sync&&!selClass)selClass=defaultClass(); refresh(x); });
  st.on('auth',authLost);
  registerHandlers();
  st.ready.then(function(had){
    if(had){ selClass=selClass||defaultClass(); paint(); FDA_PERF.firstLocalPaint=Math.round(((window.performance&&performance.now)?performance.now():0)-T0); }
    st.sync().then(function(){ if(!had){ selClass=defaultClass(); paint(); } },function(){
      if(had||!session)return;
      $('view').innerHTML='<div class="error">No signal, and nothing saved on this phone yet. Try again when the signal is back.</div><button class="btn block" id="retrySync">Try again</button>';
      $('retrySync').onclick=function(){st.sync().then(paint,function(){toast('Still no signal.',true);});};
    });
  });
}
function showStatus(s){
  var c=$('syncChip'); if(!c)return;
  c.className='sync '+s.state; c.querySelector('span').textContent=s.text;
  $('offbar').classList.toggle('hidden',s.state!=='offline');
  if($('sheet') && !$('sheet').classList.contains('hidden')) openSheet();
}
function openSheet(){
  var s=st.status(), p=st.pending(), when=st.syncedAt()?Engine.fmtTime(new Date(st.syncedAt())):'never';
  var h='<div><span class="label">Sync</span><h2 style="margin:4px 0 6px">'+esc(s.text)+'</h2><p class="muted" style="margin:0 0 10px">Last update from the studio system: '+esc(when)+'. Logged in as '+esc(me)+'.</p>';
  if(p.length){ h+='<span class="label">Waiting to send</span>';
    p.forEach(function(e){h+='<div class="person"><div class="who"><b>'+esc(e.label||e.endpoint)+'</b><small>'+(e.lastError?'Not sent yet (no signal) · '+e.tries+(e.tries===1?' try':' tries'):'Sending…')+'</small></div><button class="btn secondary sm" data-discard="'+esc(e.id)+'">Discard</button></div>';});
  } else h+='<p class="muted">Everything is saved.</p>';
  h+='<button class="btn block" id="shSync" style="margin-top:10px">Update now</button><button class="btn secondary block" id="shLogout" style="margin-top:10px">Log out</button><button class="btn secondary block" id="shClose" style="margin-top:10px">Close</button><div id="shAsk"></div></div>';
  var el=$('sheet'); el.innerHTML=h; el.classList.remove('hidden');
  el.onclick=function(e){ if(e.target===el) closeSheet(); var d=e.target.closest('[data-discard]');
    if(d){ var id=d.getAttribute('data-discard'); $('shAsk').innerHTML='<div class="ask" style="margin-top:12px"><p style="margin:0 0 10px">Discard this change? It will not be sent.</p><div class="actions"><button class="btn danger" id="shDisc">Discard</button><button class="btn secondary" id="shKeep">Keep</button></div></div>';
      $('shDisc').onclick=function(){ st.discard(id).then(openSheet); }; $('shKeep').onclick=function(){ $('shAsk').innerHTML=''; }; } };
  $('shClose').onclick=closeSheet;
  $('shSync').onclick=function(){ st.flush(); st.sync().then(function(){toast('Up to date ✓');openSheet();},function(){toast('No signal right now.',true);}); };
  $('shLogout').onclick=function(){
    var n=st.pending().length;
    if(n){ $('shAsk').innerHTML='<div class="ask" style="margin-top:12px"><p style="margin:0 0 10px"><b>'+n+(n===1?' change has':' changes have')+' not been sent yet.</b> If you log out now '+(n===1?'it':'they')+' will be lost. Wait for the signal, or log out anyway?</p><div class="actions"><button class="btn danger" id="shYes">Log out anyway</button><button class="btn secondary" id="shNo">Wait</button></div></div>';
      $('shYes').onclick=function(){closeSheet();logout();}; $('shNo').onclick=closeSheet; return; }
    closeSheet(); logout();
  };
}
function closeSheet(){ $('sheet').classList.add('hidden'); $('sheet').innerHTML=''; }

/* ---- tabs ---- */
function drawTabs(){
  var h='';TABS.forEach(function(t){h+='<button type="button" class="chip" role="tab" aria-pressed="'+(t[0]===tab)+'" data-t="'+t[0]+'">'+t[1]+'</button>';});
  var el=$('tabs');el.className='tabs';el.innerHTML=h;
  el.onclick=function(e){var b=e.target.closest('button');if(b)go(b.getAttribute('data-t'));};
  var on=el.querySelector('[aria-pressed="true"]');
  if(on){var l=on.offsetLeft-16,r=on.offsetLeft+on.offsetWidth+16-el.clientWidth;if(el.scrollLeft>l)el.scrollLeft=l;else if(el.scrollLeft<r)el.scrollLeft=r;}
}
function go(t){ tab=t; drawTabs(); window.scrollTo(0,0); paint(); }
function paint(){ if(!st)return; var v=$('view'); v.onclick=null;
  ({today:viewToday,checkin:viewCheckin,pay:viewPay,unpaid:viewUnpaid,guest:viewGuest,'new':viewNew,edit:loadEdit,history:viewHistory}[tab]||viewToday)(); }
/* data changed (sync / write): repaint what shows local data without wiping what Peggy is typing */
function refresh(x){
  if(!st||$('console').classList.contains('hidden'))return;
  var a=document.activeElement, typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('view').contains(a);
  if(tab==='today'&&!typing)viewToday();
  else if(tab==='checkin')paintCheckin();
  else if(tab==='pay'&&S.saved)viewPay();
}
var PILL={PAID:['paid','Paid'],TRIAL:['trial','Trial'],UNPAID:['unpaid','Unpaid'],GUEST:['guest','Guest'],IMPORTED:['imported','Before go-live'],ALREADY:['already','Already'],VOID:['void','Removed']};
function pill(r,pending){var p=PILL[r]||['',r];return '<span class="pill '+p[0]+'">'+esc(p[1])+'</span>'+(pending?' <span class="pill wait" title="Saving">…</span>':'');}
function holderOpts(sel){var hs=holders().slice();if(sel&&hs.indexOf(sel)<0)hs.unshift(sel);return hs.map(function(h){return '<option'+(h===sel?' selected':'')+'>'+esc(h)+'</option>';}).join('');}
function classOpts(list,sel){return list.map(function(x){return '<option value="'+esc(x.class_key)+'"'+(x.class_key===sel?' selected':'')+'>'+esc(shortLabel(x))+'</option>';}).join('');}

/* ================================================================ Today (R56) */
function viewToday(){
  var v=$('view'), list=todays(), h='';
  if(!selClass||!sessionOf(selClass))selClass=defaultClass();
  var cls=sessionOf(selClass);
  if(list.length){
    h+='<div class="clsrow" id="clsrow">';
    list.forEach(function(x){var s=stateOf(x);h+='<button type="button" class="chip'+(x.class_key===selClass?' selected':'')+'" data-k="'+esc(x.class_key)+'">'+esc(Engine.fmtTime(x.start))+'<small>'+(s==='live'?'Now':s==='done'?'Done':'Later')+'</small></button>';});
    h+='</div>';

function undoWrite(rid,undoOf){
  if(st.isPending(rid)){ st.discard(rid).then(function(){ toast('Undone ✓'); refresh({}); if(tab==='pay')viewPay(); }); return; }
  var res=RES[rid];
  if(!res){ toast('Still sending. Try Undo again in a moment.',true); return; }
  if(FDAEdit.failed(res)){ toast('Nothing to undo (it was not saved).'); return; }
  var req=undoOf(res); if(!req){ toast('Nothing to undo.'); return; }
  if(req.endpoint){ st.write(req.endpoint,req.args,{label:'Undo'}); toast('Undone ✓'); return; }
  change(req,{undo:true});
}
/* inverse of a change answer */
function inverse(req,res){
  if(req.action==='edit') return res.before?{type:req.type,action:'edit',id:req.id,patch:res.before}:null;
  if(req.action==='delete') return {type:res.type||req.type,action:'restore',id:req.id};
  return {type:res.type||req.type,action:'delete',id:req.id,reason:'Undo'};
}
/* every edit / delete / restore goes through the outbox (requestId) to door_change; patches = optimistic rows */
function change(req,o){
  o=o||{};

  var rid=st.write('door_change',function(id){req.requestId=id;return [req];},{label:label,patches:o.patches||null,meta:{type:req.type,action:req.action,id:req.id,undo:!!o.undo,req:Object.assign({},req)}});
  EM={key:'',mode:''};
  if(o.undo) toast('Undone ✓');
  else saved(rid,req.action==='delete'?'Deleted':req.action==='restore'?'Restored':'Saved',function(res){ return inverse(req,res); });
  refresh({}); if(tab==='pay')viewPay();

}

  if(p.receipt_no)h+='<p class="ehint">Receipt '+esc(p.receipt_no)+' will be voided. Make a new one after saving.</p>';
  return h+'<div class="eerr" id="eErr"></div><div class="ebtns"><button type="button" class="btn" data-eact="payGo">Save changes</button><button type="button" class="btn sec" data-eact="close">Cancel</button></div>';
}
function payEditClick(e){
  if(!PE)return false;
  var b=e.target.closest('[data-pm]'); if(b){ PE.month=b.getAttribute('data-pm'); PE.kind=''; keepPE(); repaint(); return true; }
  b=e.target.closest('[data-pk]'); if(b){ PE.kind=b.getAttribute('data-pk'); keepPE(); repaint(); return true; }
  return false;
}
function keepPE(){ if($('ePm'))PE.method=$('ePm').value; if($('ePb'))PE.by=$('ePb').value; if($('ePr'))PE.rebate=$('ePr').value; if($('ePw'))PE.reason=$('ePw').value; if($('ePd'))PE.paidOn=$('ePd').value; }
function payEditSave(it,err){
  keepPE(); var p=it.row, m=member(p.code)||{};
  var before=pays().filter(function(x){return x.pay_id!==p.pay_id&&x.code===p.code&&x.month===PE.month&&!x.void&&(String(x.ts)+'|'+x.pay_id)<(String(p.ts)+'|'+p.pay_id);});
  var o=null; Engine.paymentOptions({code:p.code,bday_month:m.bday_month},PE.month,before,ES()).forEach(function(x){if(x.kind===PE.kind)o=x;});
  if(!o)return err('Choose what was paid.');
  var rb=String(PE.rebate||'').trim()===''?0:Number(PE.rebate); if(!isFinite(rb)||rb<0||rb>o.amount)return err('Rebate must be between RM0.00 and '+rm(o.amount)+'.');
  if(rb>0&&!String(PE.reason).trim())return err('Please give a reason for the rebate.');
  var pde=paidOnErr(PE.paidOn); if(pde)return err(pde);
  var patch={month:PE.month,kind:o.kind,amount:o.amount,rebate:rb,rebateReason:rb>0?String(PE.reason).trim():'',method:PE.method,receivedBy:PE.by,paidOn:PE.paidOn};
  change({type:'payment',action:'edit',id:p.pay_id,patch:patch},{what:'payment',patches:[{coll:'payments',id:p.pay_id,row:stamp(p,{month:PE.month,kind:o.kind,amount:Math.round((o.amount-rb)*100)/100,rebate:rb,method:PE.method,received_by:PE.by,paid_on:PE.paidOn})}]});
  PE=null;
}
/* the list of payments (Today: today; Pay: this week + last week) with ⋯ */
function payRowsHtml(list,prefix){
  var h='';
  list.sort(function(a,b){return String(a.ts)<String(b.ts)?1:-1;}).forEach(function(p){
    var it=payItem(p), key=prefix+p.pay_id; ITEMS[key]=it;
    h+='<div class="person'+(p.void?' voided':'')+(p._local?' pending':'')+'" style="flex-wrap:wrap"><div class="who"><b>'+esc(it.name)+'</b><small class="vx">'+esc(KINDL[p.kind]||p.kind)+(p.month&&p.month!==ymNow()?' · for '+esc(monthLabel(p.month)):'')+(p.bundle_id?' · paid ahead':'')+' · '+rm(p.amount)+(Number(p.rebate)>0?' ('+(Engine.isPrepaidGoLive(p)?'paid before go-live ':p.promo_id?'promo ':'rebate ')+rm(p.rebate)+')':'')+' · '+esc(p.method)+' · '+esc(p.received_by)+' · '+(payDay(p)!==Engine.dateStr(now())?'paid '+esc(Engine.fmtDate(payDay(p))):esc(tsTime(p.ts)))+'</small>'+FDAEdit.tag(p)+'</div>'+(p._local?'':moreBtn(key))+menuHtml(key,it)+'</div>';
  });
  return h;
}
/* the open menu fully on screen (it may open below the fold) */
function showMenu(){ var el=document.querySelector('#view .emenu'); if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){} }
/* repaint whatever tab shows the open menu */
function repaint(){ if(tab==='today')viewToday(); else if(tab==='pay')viewPay(); else if(tab==='edit')viewEditClass(); else if(tab==='history')paintHistory(st.meta('history')); }

/* ================================================================ server answers (also for writes sent after a reload) */
function registerHandlers(){
  st.on('result',function(x){ RES[x.entry.id]=x.result; });
  st.handle('door_change',function(res,e){
    var undo=e.meta&&e.meta.undo;
    if(res&&res.needsConfirm&&e.meta&&e.meta.req){ /* R70: a used month of a payment in advance: ask, then send again with force */
      var again=Object.assign({},e.meta.req,{force:true}); delete again.requestId;
      FDAEdit.hideToast(); /* nothing was deleted yet: its "Deleted · Undo" goes, the question takes its place */
      FDAEdit.confirmBar(res.error,'Delete anyway',function(){ change(again,{what:'payment'}); });
    }
    else if(FDAEdit.failed(res)){ FDAEdit.hideToast(); toast((undo?'Undo not done: ':'Not saved: ')+((res&&res.error)||''),true); }
    else if(res.receiptVoided||res.warning) toast([res.receiptVoided?'Receipt '+res.receiptVoided+' voided. Make a new one if needed.':'',res.warning||''].join(' ').trim(),!!res.warning);
    if(tab==='edit'&&S.ed.cls&&!S.ed.busy)openEditClass(S.ed.cls.classKey,true);
    else if(tab==='history')viewHistory();
    else repaint();
  });
  st.handle('door_manualCheckIn',function(res,e,s){
    var row=s.get('attendance')['L-'+e.id];
    if(row){
      if(res&&res.attId&&['PAID','UNPAID','TRIAL'].indexOf(res.kind)>=0){ /* R63: the real row at once (sync brings the same id later) */
        s.remove('attendance',row.att_id);
        s.put('attendance',res.attId,Object.assign({},row,{att_id:res.attId,_local:undefined,result:res.kind,class_key:res.classKey||row.class_key}));
      } else if(res&&['PAID','UNPAID','TRIAL'].indexOf(res.kind)>=0)s.put('attendance',row.att_id,Object.assign({},row,{result:res.kind}));
      else s.remove('attendance',row.att_id);
    }
    S.recent.forEach(function(r){if(r.rid===e.id&&res)r.kind=res.kind;});
    if(S.ci&&S.ci.rid===e.id){S.ci.server=res; if(tab==='checkin')paintCheckin();}
    else if(res&&(res.kind==='ERROR'||res.kind==='UNKNOWN'))toast((res.message||'Check-in not saved')+' ('+(e.label||'')+')',true);
  });
  st.handle('door_recordPayment',function(res,e,s){
    if(e.meta&&e.meta.bundle){ /* R70: the phone's month rows become the real ones (same months, in order) */
      var mine=s.list('payments').filter(function(r){return r._local===e.id;}).sort(function(a,b){return a.month<b.month?-1:1;});
      mine.forEach(function(r,i){ s.remove('payments',r.pay_id); if(res&&res.ok&&res.payIds&&res.payIds[i])s.put('payments',res.payIds[i],Object.assign({},r,{pay_id:res.payIds[i],bundle_id:res.bundleId,_local:undefined})); });
    }
    var row=s.get('payments')['L-'+e.id];
    if(res&&res.ok){ if(row){ s.remove('payments',row.pay_id); s.put('payments',res.payId,Object.assign({},row,{pay_id:res.payId,_local:undefined})); }
      if(S.saved&&S.saved.rid===e.id){S.saved.payId=res.payId;S.saved.newStatus=res.newStatus;S.saved.amountLabel=res.amountLabel||S.saved.amountLabel;}
      else toast('Payment sent ✓ '+(res.name||''));
    } else { if(row)s.remove('payments',row.pay_id);
      if(S.saved&&S.saved.rid===e.id)S.saved.error=(res&&res.error)||'Not saved.'; else toast('Payment NOT saved: '+((res&&res.error)||'')+' ('+(e.label||'')+')',true); }
    if(tab==='pay'&&S.saved)viewPay();
  });
  st.handle('door_guestDropIn',function(res,e,s){ if(!(res&&res.ok)){ s.remove('attendance','L-'+e.id); s.remove('payments','L-'+e.id); toast('Guest NOT saved: '+((res&&res.error)||''),true); } });
  st.handle('door_setInstructor',function(res){ if(!(res&&res.ok))toast((res&&res.error)||'Instructor not saved',true); });
  st.handle('door_registerAndCheckIn',function(res,e){
    if(NM&&NM.rid===e.id){ if(res&&res.ok){NM.result=res.checkIn;NM.code=res.code;NM.duplicate=res.duplicate;
        if(!res.duplicate)FDAEdit.undoToast('Member registered ✓',function(){ change({type:'member',action:'delete',id:res.code,reason:'Undo'},{undo:true}); NM=blankNM(); if(tab==='new')viewNew(); }); else toast('Already a member ✓');}
      else{NM.rid='';toast((res&&res.error)||'Not saved',true);} if(tab==='new'){viewNew(); if(!NM.result&&res&&res.error)$('nmErr').innerHTML='<div class="error">'+esc(res.error)+'</div>';} }
  });
  st.handle('door_edit',function(res,e){
    S.ed.busy=false;
    if(res&&res.ok){ if(res.classes)S.ed.list=res.classes; if(S.ed.cls&&res.cls&&res.cls.classKey===S.ed.cls.classKey)S.ed.cls=res.cls; S.ed.confirm='';S.ed.moving='';
      var op=e.meta&&e.meta.op, cls=S.ed.cls;
      if(op==='add'&&res.attId)FDAEdit.undoToast((e.meta&&e.meta.ok)||'Saved ✓',function(){ change({type:'checkin',action:'delete',id:res.attId,reason:'Undo'},{undo:true}); });
      else if(op==='classDetails'&&res.before&&cls)FDAEdit.undoToast((e.meta&&e.meta.ok)||'Saved ✓',function(){ var b={op:'classDetails',classKey:cls.classKey,instructor:res.before.instructor,notes:res.before.notes};
        st.write('door_edit',function(id){b.requestId=id;return [b];},{label:'Undo class details',meta:{classKey:cls.classKey,ok:'Undone ✓',op:'undo'}}); });
      else toast((e.meta&&e.meta.ok)||'Saved ✓');
      if(S.ed.after){S.ed.after();S.ed.after=null;} }
    else toast((res&&res.error)||'Not saved',true);
    if(tab==='edit')viewEditClass();
  });
  st.on('status',function(){ if(tab==='checkin'&&S.ci)paintCheckin(); if(tab==='pay'&&S.saved)viewPay(); if(tab==='new'&&NM&&NM.rid&&!NM.result)viewNew(); else if(tab==='new')joinBtn(); });
  try{ window.addEventListener('offline',function(){ if(tab==='new')joinBtn(); }); window.addEventListener('online',function(){ if(tab==='new')joinBtn(); }); }catch(e){}
}

/* ================================================================ start: paint from this phone first (R60e) */
drawKeypad();
session=lsGet(KEY); me=lsGet(NAME_KEY)||'Peggy';
if(session) enter(); else showPin();
</script>
<script>
/* R66 - "Add to Home Screen" hint (what the old launcher/ pages said), as a small button in the shared header, only in a browser
   tab (never in the installed app: display-mode: standalone / navigator.standalone). Tapping it opens a short sheet with the
   iPhone / Android steps; on Android Chrome it can also offer the real install prompt. "Hide this" remembers on this phone. */
(function () {
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var HIDE = 'fda_install_hint_off';
  function hidden() { try { return localStorage.getItem(HIDE) === '1'; } catch (e) { return false; } }
  if (standalone || hidden()) return;
  var prompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; });
  var css = document.createElement('style');
  css.textContent = '.a2hs-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line,#2e2a38);background:transparent;color:var(--muted,#a8a3b5);font:600 12px/1 var(--body,system-ui,sans-serif);cursor:pointer;white-space:nowrap}' +
    '.a2hs-btn b{font-size:16px;color:var(--ink,#f6f6f6)}' +
    '.a2hs{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}' +
    '.a2hs .s{width:100%;max-width:480px;background:var(--surface,#17151d);border:1px solid var(--line,#2e2a38);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;font-size:15px;color:var(--ink,#f6f6f6)}' +
    '.a2hs .s p{margin:0;color:var(--muted,#a8a3b5)} .a2hs .s b{color:var(--ink,#f6f6f6)}' +
    '.a2hs .row2{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:4px}' +
    '.a2hs button{min-height:44px;border-radius:12px;border:0;padding:0 16px;font:700 15px var(--body,system-ui,sans-serif);cursor:pointer}' +
    '.a2hs .ok{background:var(--pink,#f8177f);color:#fff} .a2hs .no{background:transparent;color:var(--muted,#a8a3b5);text-decoration:underline}';
  document.head.appendChild(css);

  function open() {
    var d = document.createElement('div');
    d.className = 'a2hs'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Add to Home Screen');
    d.innerHTML = '<div class="s"><div><b>Add the FIT icon to your home screen · 添加到主屏幕</b></div>' +
      '<p><b>iPhone (Safari):</b> tap Share ⬆︎ → Add to Home Screen → Add.<br>点 分享 → 添加到主屏幕。</p>' +
      '<p><b>Android (Chrome):</b> tap ⋮ → Add to Home screen (or Install app) → Add.<br>点 ⋮ → 添加到主屏幕。</p>' +
      '<p>Then always open it from the FIT icon. · 以后从 FIT 图标打开。</p>' +
      '<div class="row2"><button type="button" class="no" data-a="hide">Hide this · 隐藏</button>' +
      (prompt ? '<button type="button" class="ok" data-a="install">Install</button>' : '<button type="button" class="ok" data-a="close">OK</button>') + '</div></div>';
    d.addEventListener('click', function (e) {
      var a = e.target && e.target.getAttribute && e.target.getAttribute('data-a');
      if (e.target === d || a === 'close') d.remove();
      else if (a === 'hide') { try { localStorage.setItem(HIDE, '1'); } catch (x) { /* ignore */ } d.remove(); var b = document.getElementById('a2hsBtn'); if (b) b.remove(); }
      else if (a === 'install' && prompt) { prompt.prompt(); prompt = null; d.remove(); }
    });
    document.body.appendChild(d);
  }
  function mount() {
    var bar = document.querySelector('.hdr-bar');
    if (!bar || document.getElementById('a2hsBtn')) return;
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'a2hsBtn'; b.className = 'a2hs-btn'; b.setAttribute('aria-label', 'Add to Home Screen');
    b.innerHTML = '<b aria-hidden="true">＋</b>App';
    b.onclick = open;
    bar.appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
